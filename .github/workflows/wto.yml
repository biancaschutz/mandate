name: Scrape WTO

# WTO's Workday tenant 429s GitHub runner IPs, so the daily run happens locally
# via launchd (~/Library/LaunchAgents/com.mandate.wto.plist). Manual trigger kept
# in case the block is lifted.
on:
  workflow_dispatch: {}

jobs:
  call:
    uses: ./.github/workflows/scrape.yml
    with:
      module: scrapers.wto
    secrets: inherit